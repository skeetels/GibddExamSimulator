name: Retry Telegram report queue

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-delivery-worker
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - name: Process pending and failed reports
        shell: bash
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          TELEGRAM_DELIVERY_WORKER_SECRET: ${{ secrets.TELEGRAM_DELIVERY_WORKER_SECRET }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_URL}"
          test -n "${TELEGRAM_DELIVERY_WORKER_SECRET}"
          response_file="${RUNNER_TEMP}/telegram-delivery-response.json"
          http_status="$(curl --silent --show-error \
            -X POST \
            -H "x-telegram-worker-secret: ${TELEGRAM_DELIVERY_WORKER_SECRET}" \
            -o "${response_file}" \
            -w '%{http_code}' \
            "${SUPABASE_URL%/}/functions/v1/telegram-delivery-worker")"
          python - "${response_file}" "${http_status}" <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          status = int(sys.argv[2])
          payload = json.loads(path.read_text(encoding="utf-8"))
          safe = {
              key: payload[key]
              for key in ("ok", "sent", "pending", "error", "databaseCode", "detail")
              if key in payload
          }
          print(json.dumps(safe, ensure_ascii=False))
          if status != 200 or payload.get("ok") is not True or payload.get("pending", 0) != 0:
              raise SystemExit(1)
          PY
