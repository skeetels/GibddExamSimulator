name: Deploy backend

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-backend
  cancel-in-progress: false

env:
  DEPLOYMENT_ENVIRONMENT_ID: ${{ vars.DEPLOYMENT_ENVIRONMENT_ID }}
  SUPABASE_URL: ${{ vars.SUPABASE_URL }}
  SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
  SYNC_API_BASE_URL: ${{ vars.SYNC_API_BASE_URL }}
  TELEGRAM_BOT_USERNAME: ${{ vars.TELEGRAM_BOT_USERNAME }}
  PAGES_URL: ${{ vars.PAGES_URL }}
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
  TELEGRAM_DELIVERY_WORKER_SECRET: ${{ secrets.TELEGRAM_DELIVERY_WORKER_SECRET }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - name: Validate required deployment values
        shell: bash
        run: |
          set -euo pipefail
          for name in DEPLOYMENT_ENVIRONMENT_ID SUPABASE_URL SUPABASE_PUBLISHABLE_KEY SYNC_API_BASE_URL TELEGRAM_BOT_USERNAME PAGES_URL SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF SUPABASE_DB_PASSWORD TELEGRAM_BOT_TOKEN TELEGRAM_WEBHOOK_SECRET TELEGRAM_DELIVERY_WORKER_SECRET; do
            test -n "${!name:-}" || { echo "Required deployment value is missing: ${name}" >&2; exit 1; }
          done
      - name: Link production project, enable anonymous auth and apply migrations
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase link --project-ref "${SUPABASE_PROJECT_REF}" --password "${SUPABASE_DB_PASSWORD}"
          sed -i "s|^site_url = .*|site_url = \"${PAGES_URL%/}\"|" supabase/config.toml
          supabase config push --project-ref "${SUPABASE_PROJECT_REF}"
          supabase db push --linked --include-all --password "${SUPABASE_DB_PASSWORD}"
      - name: Install server-only Edge Function secrets
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          release_url="https://github.com/${GITHUB_REPOSITORY}/releases/latest"
          supabase secrets set --project-ref "${SUPABASE_PROJECT_REF}" \
            DEPLOYMENT_ENVIRONMENT_ID="${DEPLOYMENT_ENVIRONMENT_ID}" \
            PUBLIC_PAIRING_BASE_URL="${PAGES_URL}" \
            PUBLIC_PWA_URL="${PAGES_URL}" \
            PUBLIC_RELEASE_URL="${release_url}" \
            TELEGRAM_BOT_USERNAME="${TELEGRAM_BOT_USERNAME}" \
            TELEGRAM_BOT_TOKEN="${TELEGRAM_BOT_TOKEN}" \
            TELEGRAM_WEBHOOK_SECRET="${TELEGRAM_WEBHOOK_SECRET}" \
            TELEGRAM_DELIVERY_WORKER_SECRET="${TELEGRAM_DELIVERY_WORKER_SECRET}" \
            MINIMUM_CLIENT_VERSION="2.0.2" \
            BANK_VERSION="ab-2025-05-26"
      - name: Deploy versioned API and Telegram functions
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          for function_name in device-api telegram-report telegram-bot telegram-delivery-worker; do
            supabase functions deploy "${function_name}" --project-ref "${SUPABASE_PROJECT_REF}"
          done
      - name: Configure the fixed Telegram webhook
        env:
          TELEGRAM_WEBHOOK_URL: ${{ vars.SUPABASE_URL }}/functions/v1/telegram-bot
        run: python tools/configure_telegram_webhook.py
      - name: Generate safe deployment contract and verify health
        shell: bash
        run: |
          set -euo pipefail
          repository_name="${GITHUB_REPOSITORY#*/}"
          pages_base="/${repository_name}/"
          python tools/configure_deployment.py \
            --environment-id "${DEPLOYMENT_ENVIRONMENT_ID}" \
            --supabase-url "${SUPABASE_URL}" \
            --supabase-publishable-key "${SUPABASE_PUBLISHABLE_KEY}" \
            --sync-api-base-url "${SYNC_API_BASE_URL}" \
            --github-repository "${GITHUB_REPOSITORY}" \
            --pages-url "${PAGES_URL}" \
            --telegram-bot-username "${TELEGRAM_BOT_USERNAME}" \
            --pages-base "${pages_base}"
          python tools/validate_deployment_config.py \
            --config build/generated/deployment-config.json --compare-clients --health
      - uses: actions/upload-artifact@v7
        with:
          name: production-deployment-config
          path: build/generated/deployment-config.json
